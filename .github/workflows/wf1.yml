name: Workflow 1
on: [workflow_dispatch, push]
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test
      - name: Final Step
        run: echo "Workflow 1 completed successfully!"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: List down the github context object
        run: |
        echo "GITHUB OBJECT:"
        echo "${ toJSON(github) }"